[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mip-models"
version = "0.1.0"
description = "Mail Intelligence Platform — Data models, schemas, and database utilities"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "pydantic>=2.7.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mip_models"]
