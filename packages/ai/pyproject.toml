[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mip-ai"
version = "0.1.0"
description = "Mail Intelligence Platform — AI provider abstractions (LLM and embedding interfaces)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mip_ai"]
