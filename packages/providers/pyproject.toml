[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mip-providers"
version = "0.1.0"
description = "Mail Intelligence Platform — Mail provider abstractions and interfaces"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mip_providers"]
