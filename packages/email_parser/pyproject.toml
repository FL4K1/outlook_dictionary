[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mip-email-parser"
version = "0.1.0"
description = "Mail Intelligence Platform — MIME email parsing and text extraction"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mip_email_parser"]
