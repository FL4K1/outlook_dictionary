[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mip-api"
version = "0.1.0"
description = "Mail Intelligence Platform â€” FastAPI backend application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "prometheus-client>=0.21.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "mip-models",
    "mip-providers",
    "mip-ai",
    "mip-email-parser",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "alembic>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
