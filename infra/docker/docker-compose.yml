name: mip-local

# PR-3.3 deployment topology. Before this change the compose file had no worker
# service at all, no migration step, no `restart:` policies, and the API was not
# wired to Elasticsearch -- so it started cleanly and returned 503 on every
# search while compose reported it healthy.

x-mip-shared-env: &mip-shared-env
  APP_ENV: ${APP_ENV:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}

  # Canonical database URL. The worker image also uses this for migrations
  # (PR-3.3 / M10, H10): apps/api/alembic/env.py resolves the URL only from the
  # Alembic config, so mip_workers.migrations injects it programmatically.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mip}:${POSTGRES_PASSWORD:-mip_dev_password}@postgres:5432/${POSTGRES_DB:-mail_intelligence}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: "0"

  # PR-3.3 / B2: the worker refuses to start without an explicit
  # ELASTICSEARCH_HOST. It previously fell back to http://localhost:9200.
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http

  # PR-3.3 / M7: one dimension value shared by the embedding producer, the index
  # provisioning, and retrieval. Changing it requires new tenant indices.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mock-embedding-v1}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mip_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mail_intelligence}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mip} -d ${POSTGRES_DB:-mail_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:9200/_cluster/health
          | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # PR-3.3 / M10, H10: schema migration runs to completion before any
  # application process starts. Uses the worker image, which ships the Alembic
  # environment alongside the worker package.
  migrate:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    command: ["python", "-m", "mip_workers.migrations", "upgrade", "head"]
    environment:
      <<: *mip-shared-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *mip-shared-env
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"

      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?set JWT_SIGNING_SECRET in .env (min 32 chars)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-mip}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mip-api}

      ENCRYPTION_DEK: ${ENCRYPTION_DEK:?set ENCRYPTION_DEK in .env (64 hex chars)}

      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_JWKS_ENDPOINT: ${ENTRA_JWKS_ENDPOINT:-}
      ENTRA_ISSUER: ${ENTRA_ISSUER:-}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:-}

      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Dependency-aware: `/health/live` is intentionally dependency-free, so the
    # API reports healthy as soon as it is serving.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # PR-3.3 / B1, H1: the ARQ worker was previously absent from compose entirely.
  worker:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    command: ["arq", "mip_workers.worker.WorkerSettings"]
    environment:
      <<: *mip-shared-env

      ENCRYPTION_DEK: ${ENCRYPTION_DEK:?set ENCRYPTION_DEK in .env (64 hex chars)}

      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_ISSUER: ${ENTRA_ISSUER:-}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:-}
      ENTRA_JWKS_ENDPOINT: ${ENTRA_JWKS_ENDPOINT:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # No `ports:` -- the worker has no HTTP listener. Liveness is asserted by
    # the image HEALTHCHECK against the ARQ heartbeat key in Redis.
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
