# Root pyproject.toml — Monorepo tooling configuration only.
# Individual packages and apps have their own pyproject.toml for dependencies.

[project]
name = "mail-intelligence-platform"
version = "0.1.0"
description = "Enterprise Mail Intelligence Platform — monorepo root"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["uvicorn.*", "redis.*", "elasticsearch.*", "minio.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "apps/workers/tests",
    "packages/models/tests",
    "packages/providers/tests",
    "tests/unit",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--strict-markers -ra -q --tb=short"

[tool.coverage.run]
source = [
    "apps/api/app",
    "packages/models/src",
    "packages/providers/src",
    "packages/ai/src",
    "packages/email_parser/src",
]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
# Exclude documentation from linting and formatting — docs/ contains Markdown
# files that are not Python source. Ruff ≥0.16.0 formats Python code blocks
# inside .md files; excluding docs/ prevents that behavior monorepo-wide.
extend-exclude = ["docs"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-jose[cryptography]>=3.5.0",
    "ruff>=0.16.3",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
